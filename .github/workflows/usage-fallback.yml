# Reusable: hands the latest run's data/usage.json to refresh.yml and onboard.yml (R10).
# data/usage.json travels in the PR, so an unmerged PR (or a run without PR) would drop its spend;
# the callers keep the higher total per month. Reading another run's artifact needs actions: read,
# so this runs as its own job and the AI jobs keep their permissions. The Console workspace spend
# limit stays the hard cap. Callers upload the artifact under the fixed name "usage".
name: usage-fallback

on:
  workflow_call:
    outputs:
      json:
        description: "usage.json of the latest usage artifact from main, compact; empty when there is none"
        value: ${{ jobs.read.outputs.json }}

permissions:
  actions: read

defaults:
  run:
    shell: bash

jobs:
  read:
    name: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      json: ${{ steps.read.outputs.json }}
    steps:
      - name: Find the latest usage artifact
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Only artifacts uploaded by runs on main of this repository (never a fork or a PR branch).
          if ! run_id="$(gh api "repos/${REPO}/actions/artifacts?name=usage&per_page=50" --jq '
              [.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main"
                and .workflow_run.head_repository_id == .workflow_run.repository_id)]
              | sort_by(.created_at) | last | .workflow_run.id // empty')"; then
            echo "::warning::Could not list artifacts; refresh uses data/usage.json from main only."
            run_id=""
          fi
          if [ -n "${run_id}" ] && [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "::warning::Unexpected run id '${run_id}'; ignored."
            run_id=""
          fi
          if [ -z "${run_id}" ]; then echo "::notice::No previous usage artifact."; fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download it
        if: steps.find.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: usage
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/usage-prev

      - name: Read it
        id: read
        env:
          DIR: ${{ runner.temp }}/usage-prev
        run: |
          file="$(find "${DIR}" -type f -name 'usage.json' 2>/dev/null | head -n 1 || true)"
          if [ -z "${file}" ]; then
            echo "json=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # refresh validates the months with its schema; here only "is it a JSON array".
          if ! json="$(jq -ce 'if type == "array" then . else error("not an array") end' "${file}")"; then
            echo "::warning::The previous usage artifact is not a JSON array; ignored."
            json=""
          fi
          echo "json=${json}" >> "${GITHUB_OUTPUT}"
