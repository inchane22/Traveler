# Publishes the site to GitHub Pages (RF-16). Runs only from main, which only changes
# through an approved PR, so nothing reaches the site without human review.
# Separate from the AI jobs: it never sees ANTHROPIC_API_KEY and holds no contents: write.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.3"

jobs:
  build:
    name: build
    # workflow_dispatch can target any branch; refuse anything but main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      # No dependency cache in the publishing workflow (cache poisoning).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Resolve base path and site URL
        id: site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          BASE_PATH_OVERRIDE: ${{ vars.BASE_PATH }}
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Project site: /<repo-name>/. A <owner>.github.io repo or a custom domain serves
          # from /, which needs the BASE_PATH repository variable.
          if [ -n "${BASE_PATH_OVERRIDE}" ]; then
            base="${BASE_PATH_OVERRIDE}"
          elif [ "${REPO_NAME,,}" = "${OWNER,,}.github.io" ]; then
            base="/"
          else
            base="/${REPO_NAME}/"
          fi
          [[ "${base}" == /* ]] || base="/${base}"
          [[ "${base}" == */ ]] || base="${base}/"

          # Fail before publishing a site whose assets point at the wrong path.
          served="${PAGES_BASE_PATH%/}/"
          [[ "${served}" == /* ]] || served="/${served}"
          if [ "${served}" != "${base}" ]; then
            echo "::error::Pages serves this site under '${served}' but the build would use '${base}'. Set the repository variable BASE_PATH to '${served}'."
            exit 1
          fi

          site="${SITE_URL_OVERRIDE:-${PAGES_BASE_URL}}"
          if [[ ! "${site}" =~ ^https:// ]]; then
            echo "::error::SITE_URL must be an https URL, got '${site}'."
            exit 1
          fi
          site="${site%/}/"
          echo "base_path=${base}" >> "${GITHUB_OUTPUT}"
          echo "site_url=${site}" >> "${GITHUB_OUTPUT}"
          echo "Deploying with BASE_PATH=${base} SITE_URL=${site}" >> "${GITHUB_STEP_SUMMARY}"

      # Backstop for R12: even if a trap proposal were merged, it never gets published.
      - name: Trap proposal check (R12)
        env:
          TRAP_SECRET: ${{ secrets.TRAP_SECRET }}
          TRAP_FINGERPRINTS: ${{ secrets.TRAP_FINGERPRINTS }}
        run: |
          if [ -z "${TRAP_SECRET}" ]; then
            echo "::warning::TRAP_SECRET is not configured; trap check skipped (README, first-time setup)."
            exit 0
          fi
          node scripts/check-trap.ts

      # pnpm build validates data, drops drafts, builds calendars and the site, then scans
      # dist/ for API keys (R8).
      - name: Build
        env:
          BASE_PATH: ${{ steps.site.outputs.base_path }}
          SITE_URL: ${{ steps.site.outputs.site_url }}
          VITE_REPO: ${{ github.repository }}
          INCLUDE_DRAFTS: "0"
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # create the Pages deployment
      id-token: write # OIDC proof that the deployment comes from this workflow and branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
