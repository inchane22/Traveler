# Monthly country onboarding (PRD «Onboarding de un país», RF-15, R2, R11).
# Creates data/countries/<cc>.json as «borrador» and opens a PR labelled needs-review.
# A draft never reaches the site: build-data drops it until a person publishes it in review.
name: onboard

on:
  schedule:
    - cron: "0 11 1 * *" # day 1 of each month, 11:00 UTC
  workflow_dispatch:
    inputs:
      country:
        description: "País a incorporar (ISO 3166-1 alfa-2), p. ej. PE / country to onboard"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Same group as refresh.yml: both spend the budget tracked in data/usage.json.
concurrency:
  group: ai-pipeline
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.3"

jobs:
  onboard:
    name: onboard
    # Drafts are always based on main; a dispatch from another branch is refused.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scheduled runs carry no inputs: take the first country of the ONBOARD_QUEUE variable
      # that has no data file yet and no onboard/<cc> branch (an open or rejected PR).
      - name: Pick the country
        id: pick
        env:
          INPUT_CC: ${{ inputs.country }}
          QUEUE: ${{ vars.ONBOARD_QUEUE }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pick=""
          if [ -n "${INPUT_CC}" ]; then
            if [[ ! "${INPUT_CC}" =~ ^[A-Za-z]{2}$ ]]; then
              echo "::error::'country' must be a two-letter ISO 3166-1 code."
              exit 1
            fi
            pick="${INPUT_CC^^}"
          else
            existing="$(gh api "repos/${REPO}/git/matching-refs/heads/onboard/" --jq '.[].ref' | tr '[:upper:]' '[:lower:]')"
            set -f # the queue is split on commas and spaces; never glob-expand it
            for cc in $(tr ',;' '  ' <<< "${QUEUE}"); do
              if [[ ! "${cc}" =~ ^[A-Za-z]{2}$ ]]; then
                echo "::warning::Skipping '${cc}' in ONBOARD_QUEUE: not a two-letter code."
                continue
              fi
              lc="${cc,,}"
              if [ -e "data/countries/${lc}.json" ]; then continue; fi
              if grep -qx "refs/heads/onboard/${lc}" <<< "${existing}"; then continue; fi
              pick="${cc^^}"
              break
            done
          fi
          if [ -z "${pick}" ]; then
            echo "::notice::Nothing to onboard: ONBOARD_QUEUE is empty or every listed country already has a data file or an onboard/<cc> branch."
          fi
          echo "country=${pick}" >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        if: steps.pick.outputs.country != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      # No dependency cache in jobs that hold write tokens (cache poisoning).
      - name: Set up Node
        if: steps.pick.outputs.country != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        if: steps.pick.outputs.country != ''
        run: pnpm install --frozen-lockfile

      - name: Run onboarding
        id: onboard
        if: steps.pick.outputs.country != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '20' }}
          MAX_FESTIVALS_PER_RUN: ${{ vars.MAX_FESTIVALS_PER_RUN || '40' }}
          ARCHIVE_ACCESS_KEY: ${{ secrets.ARCHIVE_ACCESS_KEY }}
          ARCHIVE_SECRET_KEY: ${{ secrets.ARCHIVE_SECRET_KEY }}
          TRAP_SECRET: ${{ secrets.TRAP_SECRET }}
          COUNTRY: ${{ steps.pick.outputs.country }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set (README, first-time setup)."
            exit 1
          fi
          pnpm onboard -- "--country=${COUNTRY}"

      - name: Validate data and regenerate data/index.json
        if: steps.pick.outputs.country != ''
        run: node scripts/build-data.ts

      - name: Decide whether to open a pull request
        id: pr
        if: steps.pick.outputs.country != ''
        env:
          CHANGES: ${{ steps.onboard.outputs.changes }}
          BRANCH: ${{ steps.onboard.outputs.branch }}
          COUNTRY: ${{ steps.pick.outputs.country }}
        run: |
          lc="${COUNTRY,,}"
          changes="${CHANGES:-0}"
          if [[ ! "${changes}" =~ ^[0-9]+$ ]]; then
            echo "::error::onboard wrote a non-numeric 'changes' output: '${changes}'."
            exit 1
          fi
          branch="${BRANCH:-onboard/${lc}}"
          if [[ ! "${branch}" =~ ^onboard/[A-Za-z]{2}$ ]]; then
            echo "::error::Unexpected branch name '${branch}'."
            exit 1
          fi

          open=false
          if [ "${changes}" -gt 0 ] || [ -n "$(git status --porcelain -- "data/countries/${lc}.json")" ]; then
            open=true
          fi

          # Only this country's files; git add aborts if one pathspec matches nothing.
          paths=()
          for p in "data/countries/${lc}.json" data/changelog.json data/index.json data/usage.json \
                   "config/official-domains/${lc}.json" "config/sources/${lc}.json"; do
            if [ -e "${p}" ]; then paths+=("${p}"); fi
          done

          body="${RUNNER_TEMP}/pr-body.md"
          # proposals/ is gitignored, so on a fresh runner it only holds this run's output.
          proposal="$(find proposals -maxdepth 1 -type f -name '*.md' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)"
          if [ -n "${proposal}" ] && [ -f "${proposal}" ]; then
            cat "${proposal}" > "${body}"
          else
            echo "::warning::No proposals/*.md found; the PR body only carries the checklist."
            printf '_onboard did not write a proposals/*.md summary for %s._\n' "${COUNTRY}" > "${body}"
          fi
          printf '\n\n---\n\n' >> "${body}"
          cat .github/pull_request_template.md >> "${body}"

          delimiter="paths_$(openssl rand -hex 8)"
          {
            echo "open=${open}"
            echo "branch=${branch}"
            echo "body=${body}"
            echo "paths<<${delimiter}"
            printf '%s\n' "${paths[@]}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### onboard ${COUNTRY}"
            echo ""
            echo "- Proposed changes: ${changes}"
            echo "- Pull request: ${open}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Mint GitHub App token
        id: app
        if: steps.pr.outputs.open == 'true' && vars.PR_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Re-running for a country that already has an onboard/<cc> PR force-updates that branch.
      - name: Open pull request (never auto-merged)
        id: cpr
        if: steps.pr.outputs.open == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          base: main
          branch: ${{ steps.pr.outputs.branch }}
          add-paths: ${{ steps.pr.outputs.paths }}
          commit-message: "feat(data): onboard ${{ steps.pick.outputs.country }} as a borrador draft for human review"
          title: "feat(data): incorporar ${{ steps.pick.outputs.country }} (borrador)"
          body-path: ${{ steps.pr.outputs.body }}
          labels: needs-review
          sign-commits: true
          delete-branch: false
          draft: false

      - name: Report pull request
        if: steps.cpr.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          echo "- ${PR_OPERATION}: ${PR_URL}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload proposals and usage
        if: always() && steps.pick.outputs.country != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onboard-${{ steps.pick.outputs.country }}-${{ github.run_id }}
          path: |
            proposals/
            data/usage.json
          if-no-files-found: warn
          retention-days: 90
