# Weekly AI verification (PRD «Actualización con IA», RF-15, R10, R12).
# The AI proposes, a person approves: this job only opens a PR labelled needs-review.
# It never merges and never deploys; deploy.yml runs from main after a human merge.
name: refresh

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Solo esta fiesta (slug), p. ej. carnaval-barranquilla / only this festival"
        required: false
        type: string
        default: ""
      country:
        description: "Solo este país (ISO 3166-1 alfa-2), p. ej. CO / only this country"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

# refresh and onboard share the budget in data/usage.json, so they never run at the same time.
# A second run waits instead of cancelling the first one mid-spend.
concurrency:
  group: ai-pipeline
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.3"

jobs:
  refresh:
    name: refresh
    # Proposals are always based on main; a dispatch from another branch is refused.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      # No dependency cache in jobs that hold write tokens (cache poisoning).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run weekly verification
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '20' }}
          MAX_FESTIVALS_PER_RUN: ${{ vars.MAX_FESTIVALS_PER_RUN || '40' }}
          ARCHIVE_ACCESS_KEY: ${{ secrets.ARCHIVE_ACCESS_KEY }}
          ARCHIVE_SECRET_KEY: ${{ secrets.ARCHIVE_SECRET_KEY }}
          TRAP_SECRET: ${{ secrets.TRAP_SECRET }}
          ONLY_SLUG: ${{ inputs.only }}
          ONLY_COUNTRY: ${{ inputs.country }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set (README, first-time setup)."
            exit 1
          fi
          # Dispatch inputs are untrusted text: validate before they reach the command line.
          args=()
          if [ -n "${ONLY_SLUG}" ]; then
            if [[ ! "${ONLY_SLUG}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::'only' must be a festival slug (a-z, 0-9 and hyphens)."
              exit 1
            fi
            args+=("--only=${ONLY_SLUG}")
          fi
          if [ -n "${ONLY_COUNTRY}" ]; then
            if [[ ! "${ONLY_COUNTRY}" =~ ^[A-Za-z]{2}$ ]]; then
              echo "::error::'country' must be a two-letter ISO 3166-1 code."
              exit 1
            fi
            args+=("--country=${ONLY_COUNTRY^^}")
          fi
          pnpm refresh -- "${args[@]}"

      # Schema validation of every country file, and the committed index that ci.yml checks
      # for drift. A proposal that breaks the schema stops here, before any PR exists.
      - name: Validate data and regenerate data/index.json
        run: node scripts/build-data.ts

      - name: Decide whether to open a pull request
        id: pr
        env:
          CHANGES: ${{ steps.refresh.outputs.changes }}
          BRANCH: ${{ steps.refresh.outputs.branch }}
        run: |
          changes="${CHANGES:-0}"
          if [[ ! "${changes}" =~ ^[0-9]+$ ]]; then
            echo "::error::refresh wrote a non-numeric 'changes' output: '${changes}'."
            exit 1
          fi
          branch="${BRANCH:-refresh/$(date -u +%F)}"
          if [[ ! "${branch}" =~ ^refresh/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Unexpected branch name '${branch}'."
            exit 1
          fi
          day="${branch#refresh/}"

          # A verification that only bumps last_verified is still a data change: without it
          # the site shows the stale-data notice after 30 days (RF-13).
          data_changed=false
          if [ -n "$(git status --porcelain -- data/countries data/changelog.json data/index.json)" ]; then
            data_changed=true
          fi
          open=false
          if [ "${changes}" -gt 0 ] || [ "${data_changed}" = true ]; then
            open=true
          fi

          # git add aborts the whole pathspec list if one entry matches nothing, so list only
          # files that exist. usage.json rides along in the same PR (see README, «Presupuesto»).
          paths=()
          for p in data/countries/*.json data/changelog.json data/index.json data/usage.json; do
            if [ -e "${p}" ]; then paths+=("${p}"); fi
          done

          # body-path replaces the PR template, so the reviewer checklist (R12, R3) is appended.
          body="${RUNNER_TEMP}/pr-body.md"
          proposal="proposals/${day}.md"
          if [ ! -f "${proposal}" ]; then
            proposal="$(find proposals -maxdepth 1 -type f -name '*.md' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)"
          fi
          if [ -n "${proposal}" ] && [ -f "${proposal}" ]; then
            cat "${proposal}" > "${body}"
          else
            echo "::warning::No proposals/*.md found; the PR body only carries the checklist."
            printf '_refresh did not write proposals/%s.md._\n' "${day}" > "${body}"
          fi
          printf '\n\n---\n\n' >> "${body}"
          cat .github/pull_request_template.md >> "${body}"

          delimiter="paths_$(openssl rand -hex 8)"
          {
            echo "open=${open}"
            echo "branch=${branch}"
            echo "day=${day}"
            echo "body=${body}"
            echo "paths<<${delimiter}"
            printf '%s\n' "${paths[@]}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### refresh ${day}"
            echo ""
            echo "- Proposed changes: ${changes}"
            echo "- Data files changed: ${data_changed}"
            echo "- Pull request: ${open}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${open}" = false ]; then
            echo "::notice::No data changes: no PR opened. usage.json from this run is kept only in the run artifact."
          fi

      # Optional: a GitHub App token makes ci.yml run on the bot PR by itself. Without it the
      # PR is opened with GITHUB_TOKEN and CI must be triggered by hand (README).
      - name: Mint GitHub App token
        id: app
        if: steps.pr.outputs.open == 'true' && vars.PR_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request (never auto-merged)
        id: cpr
        if: steps.pr.outputs.open == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          base: main
          branch: ${{ steps.pr.outputs.branch }}
          add-paths: ${{ steps.pr.outputs.paths }}
          commit-message: "chore(data): weekly verification ${{ steps.pr.outputs.day }}, proposals pending human review"
          title: "chore(data): verificación semanal ${{ steps.pr.outputs.day }}"
          body-path: ${{ steps.pr.outputs.body }}
          labels: needs-review
          sign-commits: true
          delete-branch: false
          draft: false

      - name: Report pull request
        if: steps.cpr.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          echo "- ${PR_OPERATION}: ${PR_URL}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload proposals and usage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-${{ github.run_id }}
          path: |
            proposals/
            data/usage.json
          if-no-files-found: warn
          retention-days: 90
